name: Windows Runner Probe

on:
  push:
    branches: ["feat/foundation-v2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Verify runner allocation
        shell: pwsh
        run: |
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "WINDOWS_RUNNER_OK"
